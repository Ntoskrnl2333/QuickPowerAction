name: Unit Tests

on:
  push:
    branches:
      - '*/*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MFC
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          
          Write-Host "VS Installation Path: $installPath"
          
          # Use vs_enterprise.exe for modifications
          $vsEnterprise = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_enterprise.exe"
          
          if (Test-Path $vsEnterprise) {
            Write-Host "Using vs_enterprise.exe"
            & $vsEnterprise modify `
              --installPath "$installPath" `
              --add Microsoft.VisualStudio.Component.VC.ATLMFC `
              --add Microsoft.VisualStudio.Component.MFC.ATL `
              --norestart `
              --quiet `
              --force
          } else {
            Write-Host "vs_enterprise.exe not found, using vs_installer.exe"
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            & $installer modify `
              --installPath "$installPath" `
              --add Microsoft.VisualStudio.Component.VC.ATLMFC `
              --add Microsoft.VisualStudio.Component.MFC.ATL `
              --norestart `
              --quiet `
              --force
          }
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: MFC installation returned code $LASTEXITCODE, continuing anyway..."
          }
          
          # Verify MSVC Tools exist
          $mfcPath = "$installPath\VC\Tools\MSVC"
          if (Test-Path $mfcPath) {
            Write-Host "MSVC Tools found at: $mfcPath"
            Get-ChildItem $mfcPath
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Test Configuration
        run: msbuild QuickPowerAction.sln /p:Configuration=Test /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Run Unit Tests
        run: |
          $exePath = "Build\${{ matrix.platform }}\Test\QuickPowerAction.exe"
          Write-Host "Running tests from: $exePath"
          & $exePath