name: Unit Tests

on:
  push:
    branches:
      - '*/*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MFC
        run: choco install visualstudio2022-workload-nativedesktop --package-parameters "--includeRecommended --includeOptional" -y

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Test Configuration
        run: msbuild QuickPowerAction.sln /p:Configuration=Test /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Run Unit Tests
        run: |
          $exePath = "Build\${{ matrix.platform }}\Test\QuickPowerAction.exe"
          Write-Host "Running tests from: $exePath"
          & $exePath
