name: Unit Tests

on:
  push:
    branches:
      - '*/*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Visual Studio MFC Component
        run: |
          $vsInstall = & "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Visual Studio installation path: $vsInstall"
          & "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "$vsInstall" --add Microsoft.VisualStudio.Component.VC.MFC --passive --norestart

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Test Configuration
        run: msbuild QuickPowerAction.sln /p:Configuration=Test /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Run Unit Tests
        run: |
          $exePath = "Build\${{ matrix.platform }}\Test\QuickPowerAction.exe"
          Write-Host "Running tests from: $exePath"
          & $exePath
