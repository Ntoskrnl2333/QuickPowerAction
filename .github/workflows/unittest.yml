name: Unit Tests

on:
  push:
    branches:
      - '*/*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath

          Write-Host "VS Installation Path: $installPath"

          # Use vs_installer.exe for modifications
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          if (Test-Path $vsInstaller) {
            Write-Host "Using vs_installer.exe"
            
            # Install MFC with both x86 and x64 toolsets
            & $vsInstaller modify `
              --installPath "`"$($installPath -replace '\\', '\\')`"" `
              --add Microsoft.VisualStudio.Component.VC.ATLMFC `
              --add Microsoft.VisualStudio.Component.VC.MFC.Atl `
              --add Microsoft.VisualStudio.Workload.NativeDesktop `
              --includeRecommended `
              --norestart `
              --passive `
              --wait
            
            if ($LASTEXITCODE -ne 0) {
              throw "MFC installation failed with code $LASTEXITCODE"
            }
          } else {
            throw "Visual Studio installer not found!"
          }

          # Wait a moment for installation to complete
          Start-Sleep -Seconds 10

          # Verify MFC components exist
          $mfcPath = Join-Path $installPath "VC\Atlmfc"
          if (Test-Path $mfcPath) {
            Write-Host "MFC installed successfully at: $mfcPath"
            Get-ChildItem $mfcPath | Select-Object Name
          } else {
            Write-Warning "MFC path not found at: $mfcPath"
          }
          
          # Show all MFC related files
          Write-Host "Checking for MFC libraries..."
          $mfcLibPath = Join-Path $installPath "VC\lib"
          if (Test-Path $mfcLibPath) {
            Get-ChildItem $mfcLibPath -Filter "mfc*.lib" | Select-Object Name -First 10
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Test Configuration
        run: msbuild QuickPowerAction.sln /p:Configuration=Test /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Run Unit Tests
        run: |
          $exePath = "Build\${{ matrix.platform }}\Test\QuickPowerAction.exe"
          Write-Host "Running tests from: $exePath"
          & $exePath