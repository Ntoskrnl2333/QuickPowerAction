name: Unit Tests

on:
  push:
    branches:
      - '*/*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MFC
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installPath = & $vswhere `
            -latest `
            -products * `
            -property installationPath

          Write-Host "Installer: $installer"
          Write-Host "VS Path: $installPath"

          & $installer modify `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet `
            --wait `
            --norestart `
            --force

          if ($LASTEXITCODE -ne 0) {
            throw "MFC install failed with code $LASTEXITCODE"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Test Configuration
        run: msbuild QuickPowerAction.sln /p:Configuration=Test /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Run Unit Tests
        run: |
          $exePath = "Build\${{ matrix.platform }}\Test\QuickPowerAction.exe"
          Write-Host "Running tests from: $exePath"
          & $exePath
