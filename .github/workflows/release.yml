name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MFC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS installation path: $vsPath"

          Write-Host "Searching for existing MFC libraries..."
          $mfcLibs = @(Get-ChildItem "$vsPath\VC\Tools\MSVC\*\atlmfc\lib\*\mfc*.lib" -ErrorAction SilentlyContinue)
          if ($mfcLibs.Count -gt 0) {
            Write-Host "MFC libraries already installed: $($mfcLibs.Count) files found"
          } else {
            Write-Host "MFC libraries not found. Attempting installation..."
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify `
              --installPath "$vsPath" `
              --add Microsoft.VisualStudio.Component.VC.ATLMFC `
              --passive --wait --norestart --force

            if ($LASTEXITCODE -ne 0) {
              throw "MFC installation failed with exit code $LASTEXITCODE"
            }

            Start-Sleep -Seconds 3
            $mfcLibs = @(Get-ChildItem "$vsPath\VC\Tools\MSVC\*\atlmfc\lib\*\mfc*.lib" -ErrorAction SilentlyContinue)
            if ($mfcLibs.Count -eq 0) {
              Write-Warning "MFC verification failed, but continuing..."
            } else {
              Write-Host "MFC installation verified: $($mfcLibs.Count) library files found"
            }
          }

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick -y --no-progress

      - name: Generate icons
        shell: pwsh
        run: |
          Push-Location res/icon
          & .\build.bat
          Pop-Location

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore QuickPowerAction.sln

      - name: Build Release|x64
        run: msbuild QuickPowerAction.sln /p:Configuration=Release /p:Platform="x64" /m /verbosity:minimal

      - name: Build Release|x86
        run: msbuild QuickPowerAction.sln /p:Configuration=Release /p:Platform="x86" /m /verbosity:minimal

      - name: Extract Version from .rc file
        id: extract-version
        shell: pwsh
        run: |
          $rcFile = "QuickPowerAction.rc"
          $content = Get-Content $rcFile -Raw
          $match = [regex]::Match($content, 'VALUE\s+"ProductVersion",\s+"([^"]+)"')
          if ($match.Success) {
            $rawVersion = $match.Groups[1].Value
            $versionMatch = [regex]::Match($rawVersion, '(\d+\.\d+\.\d+\.\d+)')
            if ($versionMatch.Success) {
              $version = $versionMatch.Groups[1].Value
            } else {
              $version = $rawVersion
            }
            $tag = "v${version}"
            Write-Host "Extracted version: $version"
            Write-Host "Generated tag: $tag"
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Failed to extract ProductVersion from $rcFile"
            exit 1
          }

      - name: Generate Changelog
        id: changelog
        shell: pwsh
        run: |
          $lastTag = git describe --tags --abbrev=0 --match "v*" 2>$null
          if ($lastTag) {
            Write-Host "Last release tag: $lastTag"
            $commits = git log "$lastTag..HEAD" --pretty=format:"- %s" --no-merges
          } else {
            Write-Host "No previous release tags found, using all commits"
            $commits = git log --pretty=format:"- %s" --no-merges
          }

          $feat = @()
          $fix = @()
          $chore = @()
          $other = @()

          foreach ($commit in $commits) {
            if ($commit -match "^\- feat") { $feat += $commit }
            elseif ($commit -match "^\- fix") { $fix += $commit }
            elseif ($commit -match "^\- chore") { $chore += $commit }
            else { $other += $commit }
          }

          $changelog = "## 📋 Changelog`n`n"
          if ($feat) { $changelog += "### ✨ Features`n" + ($feat -join "`n") + "`n`n" }
          if ($fix) { $changelog += "### 🐛 Fixes`n" + ($fix -join "`n") + "`n`n" }
          if ($chore) { $changelog += "### 🔧 Toolchains`n" + ($chore -join "`n") + "`n`n" }
          if ($other) { $changelog += "### 📝 Others`n" + ($other -join "`n") + "`n`n" }

          $changelogPath = "changelog.md"
          $changelog | Out-File -FilePath $changelogPath -Encoding utf8
          Write-Host "Generated changelog:"
          Get-Content $changelogPath

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.extract-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path output

          # Release x64
          Copy-Item x64/Release/QuickPowerAction.exe "output/QuickPowerAction_x64_$ver.exe"
          Copy-Item x64/Release/QuickPowerAction.pdb "output/QuickPowerAction_x64_$ver.pdb" -ErrorAction SilentlyContinue

          # Release x86
          Copy-Item x86/Release/QuickPowerAction.exe "output/QuickPowerAction_x86_$ver.exe"
          Copy-Item x86/Release/QuickPowerAction.pdb "output/QuickPowerAction_x86_$ver.pdb" -ErrorAction SilentlyContinue

          Get-ChildItem output

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract-version.outputs.tag }}
          name: "QuickPowerAction ${{ steps.extract-version.outputs.version }}"
          body_path: changelog.md
          prerelease: false
          files: |
            output/QuickPowerAction_x64_${{ steps.extract-version.outputs.version }}.exe
            output/QuickPowerAction_x64_${{ steps.extract-version.outputs.version }}.pdb
            output/QuickPowerAction_x86_${{ steps.extract-version.outputs.version }}.exe
            output/QuickPowerAction_x86_${{ steps.extract-version.outputs.version }}.pdb
          generate_release_notes: false
